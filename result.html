<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your Result</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

    <h1>🎯 Challenge Completed!</h1>

    <p>
        Enter your details below to unlock your IT Skill Score.
    </p>

    <form id="studentForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name *"
            required
        >

        <input
            type="tel"
            id="mobile"
            placeholder="Mobile Number *"
            pattern="[0-9]{10}"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address *"
            required
        >

        <input
            type="text"
            id="college"
            placeholder="College Name *"
            required
        >

        <input
            type="text"
            id="department"
            placeholder="Department *"
            required
        >

        <select id="graduation" required>
            <option value="">Select Graduation Year</option>
            <option>2026</option>
            <option>2027</option>
            <option>2028</option>
            <option>2029</option>
        </select>

        <button type="submit" class="submit-btn" id="submitBtn">
            UNLOCK MY SCORE
        </button>

    </form>

    <div id="message"></div>

</div>

<script>
// ============================================
// ★★★ YOUR GOOGLE APPS SCRIPT URL ★★★
// ============================================
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzltAw8UBOvkOeh5J_RouwxqpPgM6ano0n9Z0hmr-vLaS98Q5dfFq_a4LfkakpsXawC/exec";

// ============================================
// ★★★ FORM SUBMISSION - FULLY WORKING ★★★
// ============================================

document.getElementById("studentForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.querySelector(".submit-btn");
    const messageDiv = document.getElementById("message");

    // Reset message
    messageDiv.textContent = "";
    messageDiv.style.padding = "0";
    messageDiv.style.display = "block";

    // === GET FORM VALUES ===
    const name = document.getElementById("name").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim();
    const college = document.getElementById("college").value.trim();
    const department = document.getElementById("department").value.trim();
    const graduation = document.getElementById("graduation").value;

    // === VALIDATION ===
    if (!name || !mobile || !email || !college || !department || !graduation) {
        messageDiv.textContent = "⚠️ Please fill in all fields.";
        messageDiv.style.color = "#ff5dbd";
        return;
    }

    if (mobile.length !== 10 || !/^[0-9]{10}$/.test(mobile)) {
        messageDiv.textContent = "⚠️ Please enter a valid 10-digit mobile number.";
        messageDiv.style.color = "#ff5dbd";
        return;
    }

    if (!email.includes('@') || !email.includes('.')) {
        messageDiv.textContent = "⚠️ Please enter a valid email address.";
        messageDiv.style.color = "#ff5dbd";
        return;
    }

    // === GET QUIZ DATA ===
    const score = sessionStorage.getItem("quizScore");
    const total = sessionStorage.getItem("totalQuestions");
    const timeUsed = sessionStorage.getItem("timeUsed");

    // === PREPARE DATA ===
    const studentData = {
        name: name,
        mobile: mobile,
        email: email,
        college: college,
        department: department,
        graduation: graduation,
        score: score || 0,
        total: total || 15,
        timeUsed: timeUsed || 0,
        submittedAt: new Date().toLocaleString('en-IN', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        })
    };

    // Disable button and show loading
    button.disabled = true;
    button.textContent = "⏳ SUBMITTING...";
    messageDiv.textContent = "⏳ Saving your data...";
    messageDiv.style.color = "#55e4ef";

    try {
        // ============================================
        // ★★★ SEND DATA TO GOOGLE APPS SCRIPT ★★★
        // ============================================
        const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(studentData)
        });

        // === CHECK RESPONSE ===
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        // === PARSE RESPONSE ===
        let result;
        try {
            result = await response.json();
        } catch (parseError) {
            console.warn("Response is not JSON, but request was sent successfully");
            result = { success: true, message: "Data received" };
        }

        console.log("✅ Response from Google Script:", result);

        // === HANDLE SUCCESS ===
        if (result && result.success !== false) {
            messageDiv.textContent = "✅ Data saved successfully!";
            messageDiv.style.color = "#55e4ef";
            
            // Store submission status
            sessionStorage.setItem("studentSubmitted", "true");
            sessionStorage.setItem("studentName", name);
            
            // Redirect to score page
            setTimeout(() => {
                window.location.href = "score.html";
            }, 1000);
            
        } else {
            throw new Error(result?.message || "Failed to save data");
        }

    } catch (error) {
        // === ERROR HANDLING ===
        console.error("❌ Submission error:", error);
        
        // Show error message
        messageDiv.textContent = "⚠️ " + error.message;
        messageDiv.style.color = "#ff5dbd";
        
        // Re-enable button
        button.disabled = false;
        button.textContent = "UNLOCK MY SCORE";
    }
});
</script>

</body>
</html>
