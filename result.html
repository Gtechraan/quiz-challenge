<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your Result</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

    <h1>🎯 Challenge Completed!</h1>

    <p>
        Enter your details below to unlock your IT Skill Score.
    </p>

    <form id="studentForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name *"
            required
        >

        <input
            type="tel"
            id="mobile"
            placeholder="Mobile Number *"
            pattern="[0-9]{10}"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address *"
            required
        >

        <input
            type="text"
            id="college"
            placeholder="College Name *"
            required
        >

        <input
            type="text"
            id="department"
            placeholder="Department *"
            required
        >

        <select id="graduation" required>
            <option value="">Select Graduation Year</option>
            <option>2026</option>
            <option>2027</option>
            <option>2028</option>
            <option>2029</option>
        </select>

        <button type="submit" class="submit-btn">
            UNLOCK MY SCORE
        </button>

    </form>

    <div id="message"></div>

</div>

<script>
    // Replace with your Google Apps Script URL when ready
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzltAw8UBOvkOeh5J_RouwxqpPgM6ano0n9Z0hmr-vLaS98Q5dfFq_a4LfkakpsXawC/exec";

    document.getElementById("studentForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const button = document.querySelector(".submit-btn");
        button.disabled = true;
        button.textContent = "SUBMITTING...";

        const score = sessionStorage.getItem("quizScore");
        const total = sessionStorage.getItem("totalQuestions");
        const timeUsed = sessionStorage.getItem("timeUsed");

        const studentData = {
            name: document.getElementById("name").value.trim(),
            mobile: document.getElementById("mobile").value.trim(),
            email: document.getElementById("email").value.trim(),
            college: document.getElementById("college").value.trim(),
            department: document.getElementById("department").value.trim(),
            graduation: document.getElementById("graduation").value,
            score: score,
            total: total,
            timeUsed: timeUsed,
            submittedAt: new Date().toLocaleString()
        };

        try {
            // If you have Google Apps Script URL, uncomment this
            /*
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(studentData)
            });
            */

            // For now, just store in session and proceed
            sessionStorage.setItem("studentSubmitted", "true");
            window.location.href = "score.html";

        } catch (error) {
            console.error(error);
            button.disabled = false;
            button.textContent = "UNLOCK MY SCORE";
            document.getElementById("message").textContent = "Something went wrong. Please try again.";
        }
    });
</script>

</body>
</html>
